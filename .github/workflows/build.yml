name: Construieste aplicatia (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Instaleaza Rust (automat, versiunea stabila cea mai noua)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (build-uri mai rapide dupa prima rulare)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Instaleaza Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Construieste aplicatia
        working-directory: app
        run: cargo tauri build

      - name: Incarca fisierele construite (instalatoarele)
        uses: actions/upload-artifact@v4
        with:
          name: mashup-engine-windows
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
