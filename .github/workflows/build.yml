name: Construieste aplicatia (Windows, Mac, Linux)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nume: windows
          - os: macos-latest
            nume: macos
          - os: ubuntu-22.04
            nume: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Instaleaza Rust (automat, versiunea stabila cea mai noua)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (build-uri mai rapide dupa prima rulare)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Instaleaza dependintele de sistem (doar Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Instaleaza Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Construieste aplicatia
        working-directory: app
        run: cargo tauri build

      - name: Incarca fisierele construite (instalatoarele)
        uses: actions/upload-artifact@v4
        with:
          name: mashup-engine-${{ matrix.nume }}
          path: |
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
